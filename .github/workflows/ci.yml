name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: signing-runner

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          macos: 'gotest/test-macos.7z'
          win-x64: 'gotest/test-winx64.7z'
          win-arm64: 'gotest/test-winarm64.7z'
          mac-signing-server: 'https://signingserver-mac.ci.qt.io/'
          mac-signing-user: '${{ secrets.MAC_SIGNING_USER }}'
          mac-signing-token: '${{ secrets.MAC_SIGNING_TOKEN }}'
          win-signing-server: 'https://signingserver-win.ci.qt.io/'
          win-signing-user: '${{ secrets.WIN_SIGNING_USER }}'
          win-signing-token: '${{ secrets.WIN_SIGNING_TOKEN }}'

      - name: Print Output
        id: output
        run: ls -lach "${{ steps.test-action.outputs.macos }}"
