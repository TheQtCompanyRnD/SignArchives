name: 'SignArchives'
description: 'Signs the archives'
author: 'Marcus Tillmanns'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: 'heart'
  color: 'green'

# Define your inputs here.
inputs:
  macos:
    description: 'Path to macos archive'
    required: false
    default: ''
  win-x64:
    description: 'Path to Windows x64 archive'
    required: false
    default: ''
  win-arm64:
    description: 'Path to Windows arm64 archive'
    required: false
    default: ''
  mac-signing-server:
    description: 'Base URL of the macOS signing server'
    required: false
    default: ''
  win-signing-server:
    description: 'Base URL of the Windows signing server'
    required: false
    default: ''
  mac-signing-user:
    description: 'Username for the macOS signing server'
    required: false
    default: ''
  mac-signing-token:
    description: 'Password for the macOS signing server'
    required: false
    default: ''
  win-signing-user:
    description: 'Username for the Windows signing server'
    required: false
    default: ''
  win-signing-token:
    description: 'Password for the Windows signing server'
    required: false
    default: ''

# Define your outputs here.
outputs:
  macos:
    description: 'Path to signed archive for macos'
  win-x64:
    description: 'Path to signed archive for windows x64'
  win-arm64:
    description: 'Path to signed archive for windows arm64'

runs:
  using: node24
  main: dist/index.js
